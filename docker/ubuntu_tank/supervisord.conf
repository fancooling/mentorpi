; Runtime-only process configuration. Required environment and deadlines are
; documented in ubuntu_tank/docs/CONTAINER_SUPERVISION.md. No TCP control API.
[unix_http_server]
file=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
pidfile=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s/supervisord.pid
logfile=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s/supervisord.log
logfile_maxbytes=1MB
logfile_backups=2
childlogdir=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:controller]
command=%(ENV_UBUNTU_TANK_PYTHON)s %(ENV_UBUNTU_TANK_PREFIX)s/bin/mentorpi-tank-run
autostart=false
autorestart=false
startretries=0
startsecs=0
stopasgroup=true
killasgroup=true
stopsignal=INT
stopwaitsecs=1
priority=40
redirect_stderr=true
stdout_logfile=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s/controller.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2

[program:operator]
command=%(ENV_UBUNTU_TANK_PYTHON)s -m ubuntu_tank_operator.entrypoint --ros-args --enclave /ubuntu_tank/operator
autostart=true
autorestart=false
startretries=0
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=1
priority=20
redirect_stderr=true
stdout_logfile=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s/operator.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2

[program:lifecycle]
command=%(ENV_UBUNTU_TANK_PYTHON)s %(ENV_UBUNTU_TANK_PREFIX)s/bin/mentorpi-tank-lifecycle
autostart=true
autorestart=false
startretries=0
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=1
priority=30
redirect_stderr=true
stdout_logfile=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s/lifecycle.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2

[eventlistener:safety]
command=%(ENV_UBUNTU_TANK_PYTHON)s -m ubuntu_tank_supervisor.runtime_monitor
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL,PROCESS_STATE_STOPPED
buffer_size=100
autostart=true
autorestart=false
startretries=0
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=2
priority=10
stderr_logfile=%(ENV_UBUNTU_TANK_PRIVATE_DIR)s/safety.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
