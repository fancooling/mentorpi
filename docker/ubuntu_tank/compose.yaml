# Paired deployment; deploy.py supplies immutable images and verified host identity.
name: ubuntu-tank
x-common: &common
  platform: linux/arm64
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    UBUNTU_TANK_DEPLOYMENT_DIR: /run/ubuntu_tank-deployment
    UBUNTU_TANK_DEPLOYMENT_TOKEN: ${DEPLOYMENT_TOKEN:?Deploy through deploy.py}
    UBUNTU_TANK_RELEASE_ID: ${RELEASE_ID:?Set the verified release}
    UBUNTU_TANK_CONTEXT_SHA256: ${CONTEXT_SHA256:?Set the verified build}
  labels:
    org.mentorpi.release: ${RELEASE_ID:?Set the verified release}
  restart: unless-stopped
  stop_grace_period: 5s
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  runtime:
    <<: *common
    image: ${RUNTIME_IMAGE:?Set the runtime image digest from the release manifest}
    network_mode: none
    group_add: ["${SERIAL_GID:?Set the verified numeric device group}"]
    devices: [/dev/rrc:/dev/rrc:rw]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
      - /run/ubuntu_tank-private:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=0700
    volumes:
      - type: bind
        source: /var/lib/ubuntu_tank-container/control
        target: /run/ubuntu_tank-deployment
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/ubuntu_tank-container/ipc
        target: /run/ubuntu_tank
        bind: {create_host_path: false}
      - type: bind
        source: /run/ubuntu_tank-container/owner
        target: /run/ubuntu_tank-owner
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/opt/ubuntu_tank/controller.yaml
        target: /etc/opt/ubuntu_tank/controller.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/opt/ubuntu_tank/security/keystore
        target: /etc/opt/ubuntu_tank/security/keystore
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/opt/ubuntu_tank/ros-log
        target: /var/opt/ubuntu_tank/ros-log
        bind: {create_host_path: false}
  web:
    <<: *common
    image: ${WEB_IMAGE:?Set the web image digest from the release manifest}
    ports: ["8443:8443"]
    volumes:
      - type: bind
        source: /var/lib/ubuntu_tank-container/control
        target: /run/ubuntu_tank-deployment
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/ubuntu_tank-container/ipc
        target: /run/ubuntu_tank
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/opt/ubuntu_tank/web/web.yaml
        target: /etc/opt/ubuntu_tank/web/web.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/opt/ubuntu_tank/web/certs
        target: /var/opt/ubuntu_tank/web/certs
        read_only: true
        bind: {create_host_path: false}
