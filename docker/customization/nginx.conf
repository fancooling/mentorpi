worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        # Listen on all IPv4 (0.0.0.0) and IPv6 ([::]) interfaces so the
        # dashboard and video proxy are accessible across Wi-Fi (wlan0),
        # AP mode (ap0), and Ethernet from remote browsers.
        listen 8081;
        listen [::]:8081;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Reuse the factory web_video_server on host port 8080. Streaming must
        # not be buffered, otherwise MJPEG frames arrive in bursts.
        location /video/ {
            limit_except GET HEAD {
                deny all;
            }

            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            # Allow cross-origin access if streaming is embedded in external browsers/dashboards
            add_header Access-Control-Allow-Origin * always;
        }

        # Never turn the UI origin into a second bidirectional rosbridge
        # endpoint. The subscription-only dashboard connects to the factory's
        # existing port 9090 directly.
        location = /ros {
            return 404;
        }

        location = /ros/ {
            return 404;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }

            try_files $uri $uri/ /index.html;
        }
    }
}
