# /etc/tmpfiles.d/ubuntu-tank.conf
# Runtime and state directories for MentorPi Tank controller

d /run/ubuntu_tank 0775 ubuntu-tank ubuntu-tank-operators -
f /run/ubuntu_tank/operator.lock 0660 ubuntu-tank-operator ubuntu-tank-operators -
d /run/lock/ubuntu_tank 0755 root root -
f /run/lock/ubuntu_tank/deploy.lock 0644 root root -
d /var/opt/ubuntu_tank 0755 root root -
d /var/opt/ubuntu_tank/ros-log 0750 ubuntu-tank mentorpi-rrc -
d /var/opt/ubuntu_tank/deployment 0755 root root -
d /var/opt/ubuntu_tank/deployment/snapshots 0700 root root -
d /var/opt/ubuntu_tank/operator-log 0750 ubuntu-tank-operator ubuntu-tank-operators -
